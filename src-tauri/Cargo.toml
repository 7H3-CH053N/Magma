[package]
name = "magma"
version = "0.1.1"
description = "A beautiful, LLM-native second brain"
authors = ["Magma contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "magma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
magma-core = { path = "../crates/magma-core" }
magma-mcp = { path = "../crates/magma-mcp" }
magma-webdav = { path = "../crates/magma-webdav" }
magma-import = { path = "../crates/magma-import" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
