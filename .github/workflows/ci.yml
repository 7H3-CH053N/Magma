name: CI

on:
  push:
    branches: [main]
    # Version tags build the installers and publish them to a Release. Without
    # this the bundle job's tag condition could never fire — a tag push does
    # not match a branch filter.
    tags: ["v*"]
  pull_request:
  # Installer builds are opt-in: run them from the Actions tab when you want a
  # .dmg/.msi to install. Give a tag to cut a release in the same run — handy
  # when a tag cannot be pushed from where you are working.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release under this tag (e.g. v0.1.0). Empty = build artifacts only."
        required: false
        default: ""

# Cancel superseded runs on the same ref so pushes don't pile up duplicate runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, platform-independent checks: frontend build + core Rust tests.
  # These run on Linux and don't need the desktop system libraries.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Rust tests (core + MCP + WebDAV)
        run: cargo test -p magma-core -p magma-mcp -p magma-webdav -p magma-import --locked

  # Full desktop bundle build on the platforms Magma targets. Each OS builds
  # only the installer that doesn't need a flaky network download at bundle time
  # (macOS: .dmg, Windows: .msi — Windows NSIS is skipped because it fetches a
  # helper DLL from GitHub releases, which intermittently 504s).
  # macOS minutes bill at 10x and Windows at 2x, so building installers on every
  # push burns the monthly allowance fast. They only run on demand
  # (Actions tab -> Run workflow) or on a version tag — the Linux `checks` job
  # above still guards every push and PR.
  bundle:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    # Needed to attach the installers to a GitHub Release on a version tag.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS runners are Apple Silicon, so a default build produces an
          # arm64-only DMG that simply will not launch on an Intel Mac. The
          # universal target covers both at the cost of compiling twice.
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
          - os: windows-latest
            bundles: msi
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Add the macOS architectures
        if: matrix.target != ''
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - name: Build desktop app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >
          npm run tauri build --
          --bundles ${{ matrix.bundles }}
          ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Upload desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: magma-${{ matrix.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sig
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate updater manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse

          root = pathlib.Path("release-artifacts")
          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          version = tag[1:] if tag.startswith("v") else tag

          def one(pattern):
              matches = sorted(root.glob(pattern))
              if not matches:
                  raise SystemExit(f"missing release artifact: {pattern}")
              return matches[0]

          mac = one("**/*.app.tar.gz")
          win = one("**/*.msi")
          mac_sig = pathlib.Path(str(mac) + ".sig").read_text().strip()
          win_sig = pathlib.Path(str(win) + ".sig").read_text().strip()

          def url(path):
              return f"https://github.com/{repo}/releases/download/{tag}/{urllib.parse.quote(path.name)}"

          latest = {
              "version": version,
              "notes": f"Magma {tag}",
              "platforms": {
                  "darwin-aarch64": {"signature": mac_sig, "url": url(mac)},
                  "darwin-x86_64": {"signature": mac_sig, "url": url(mac)},
                  "windows-x86_64": {"signature": win_sig, "url": url(win)},
              },
          }
          pathlib.Path("latest.json").write_text(json.dumps(latest, indent=2) + "\n")
          PY

      # On a version tag the installers go to a Release as well: artifacts
      # expire after 90 days and need a GitHub login to download, which is no
      # way to hand an app to someone.
      - name: Publish installers and updater manifest
        uses: softprops/action-gh-release@v2
        with:
          # A tag push releases under that tag; a dispatch releases under the
          # tag typed into the form, creating it at this commit.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            release-artifacts/**/*.msi
            release-artifacts/**/*.msi.sig
            release-artifacts/**/*.dmg
            release-artifacts/**/*.app.tar.gz
            release-artifacts/**/*.app.tar.gz.sig
            latest.json
          fail_on_unmatched_files: false
          generate_release_notes: true
          body: |
            Desktop builds of Magma for macOS and Windows.

            **These installers are not code-signed**, so the first launch is
            blocked by the OS. That is expected for an app without a
            certificate — the README explains the two clicks it takes:

            - macOS: right-click Magma in *Applications* → **Open** → **Open**
            - Windows: SmartScreen → **More info** → **Run anyway**

            Installation, first steps and how to connect Claude:
            [English](https://github.com/7H3-CH053N/Magma#install) ·
            [Deutsch](https://github.com/7H3-CH053N/Magma/blob/main/README.de.md#installation)
