name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  # Fast, platform-independent checks: frontend build + core Rust tests.
  # These run on Linux and don't need the desktop system libraries.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Core crate tests
        run: cargo test -p magma-core --locked

  # Full desktop bundle build on the platforms Magma targets.
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm ci
      - name: Build desktop app
        run: npm run tauri build
