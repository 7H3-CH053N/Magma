name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so pushes don't pile up duplicate runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, platform-independent checks: frontend build + core Rust tests.
  # These run on Linux and don't need the desktop system libraries.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Rust tests (core + MCP + WebDAV)
        run: cargo test -p magma-core -p magma-mcp -p magma-webdav --locked

  # Full desktop bundle build on the platforms Magma targets. Each OS builds
  # only the installer that doesn't need a flaky network download at bundle time
  # (macOS: .dmg, Windows: .msi — Windows NSIS is skipped because it fetches a
  # helper DLL from GitHub releases, which intermittently 504s).
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg
          - os: windows-latest
            bundles: msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build desktop app
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Upload desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: magma-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
          if-no-files-found: ignore
