name: CI

on:
  push:
    branches: [main]
    # Version tags build the installers and publish them to a Release. Without
    # this the bundle job's tag condition could never fire — a tag push does
    # not match a branch filter.
    tags: ["v*"]
  pull_request:
  # Installer builds are opt-in: run them from the Actions tab when you want a
  # .dmg/.msi to install. Give a tag to cut a release in the same run — handy
  # when a tag cannot be pushed from where you are working.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release under this tag (e.g. v0.1.0). Empty = build artifacts only."
        required: false
        default: ""
      platforms:
        description: "Which installers to build. A release always builds both."
        required: false
        type: choice
        default: both
        options: [both, windows, macos]

# Cancel superseded runs on the same ref so pushes don't pile up duplicate runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, platform-independent checks: frontend build + core Rust tests.
  # These run on Linux and don't need the desktop system libraries.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build frontend
        run: npm run build
      # `npm test` existed as a script but nothing ever called it, so a frontend
      # test could have been written and silently never run.
      - name: Frontend tests
        run: npm test
      - name: Rust tests (core + MCP + WebDAV)
        run: cargo test -p magma-core -p magma-mcp -p magma-webdav -p magma-import -p magma-embed --locked

  desktop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Rust tests (desktop shell)
        run: cargo test -p magma --locked

  # Full desktop bundle build on the platforms Magma targets. Each OS builds
  # only the installer that doesn't need a flaky network download at bundle time
  # (macOS: .dmg, Windows: .msi — Windows NSIS is skipped because it fetches a
  # helper DLL from GitHub releases, which intermittently 504s).
  # macOS minutes bill at 10x and Windows at 2x, so building installers on every
  # push burns the monthly allowance fast. They only run on demand
  # (Actions tab -> Run workflow) or on a version tag — the Linux `checks` job
  # above still guards every push and PR.
  # Which installers this run builds. A job-level `if` cannot see the matrix, so
  # choosing legs means handing `bundle` its matrix rather than filtering one.
  # Worth the extra job: a macOS runner bills at ten times the Linux rate and
  # notarisation can add half an hour, so a Windows-only test build should not
  # pay for a DMG nobody asked for.
  targets:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          WANT: ${{ inputs.platforms }}
          TAG: ${{ inputs.release_tag }}
        run: |
          # macOS runners are Apple Silicon, so a default build produces an
          # arm64-only DMG that simply will not launch on an Intel Mac. The
          # universal target covers both at the cost of compiling twice.
          mac='{"os":"macos-latest","bundles":"dmg","target":"universal-apple-darwin"}'
          win='{"os":"windows-latest","bundles":"msi","target":""}'
          # A release ships both platforms whatever the box says, and a tag push
          # has no inputs at all. Only a plain test build may narrow.
          if [ -n "$TAG" ]; then WANT=both; fi
          case "${WANT:-both}" in
            windows) include="[$win]" ;;
            macos)   include="[$mac]" ;;
            *)       include="[$mac,$win]" ;;
          esac
          echo "building: $include"
          echo "matrix=$include" >> "$GITHUB_OUTPUT"

  bundle:
    needs: targets
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    # Needed to attach the installers to a GitHub Release on a version tag.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Notarisation blocks on Apple's service, and the wait has no ceiling of its
    # own. The default six hours on a macOS runner, billed at ten times the
    # Linux rate, is an expensive way to find out the queue is stuck. An hour is
    # far more than a cached universal build plus a healthy notarisation needs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Add the macOS architectures
        if: matrix.target != ''
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      # `createUpdaterArtifacts` is on, and Tauri signs those artifacts with a
      # key only the repo owner can generate. It does that *after* writing the
      # installer, so a missing key used to fail the job with the .dmg/.msi
      # already sitting on disk — and the upload step never ran. An unsigned
      # test build is worth having, so detect the key and drop the updater
      # artifacts when it is absent. Cutting a release still needs it: the
      # release job below refuses to publish without the signatures.
      - name: Check for an updater signing key
        id: signing
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set. Building installers only — this run cannot feed the in-app updater. See the Auto-update section of the README."
          fi
      # macOS code signing and notarisation. Both are optional in exactly the
      # same way the updater key is: without them the build still produces an
      # installable .dmg, it is just the unsigned one that Gatekeeper argues
      # with. Variable names are Tauri's own — anything else is ignored.
      #
      # They are exported through GITHUB_ENV rather than the step's `env:` so
      # that when the secrets are absent the variables do not exist at all.
      # An empty APPLE_CERTIFICATE would make the CLI try to sign with nothing.
      - name: Prepare Apple signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$CERT" ]; then
            echo "::warning::No APPLE_CERTIFICATE — building an unsigned .dmg. First launch will need right-click → Open. See the Signing section of the README."
            exit 0
          fi
          # Heredoc form: a base64 certificate can carry newlines, and a plain
          # KEY=value line would truncate at the first one.
          {
            echo "APPLE_CERTIFICATE<<__CERT__"
            echo "$CERT"
            echo "__CERT__"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$API_KEY_P8" ]; then
            # Tauri wants a *path* to the .p8; the secret holds its contents.
            printf '%s' "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc.p8"
            {
              echo "APPLE_API_KEY=$API_KEY_ID"
              echo "APPLE_API_ISSUER=$API_ISSUER"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/asc.p8"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Certificate present but no APPLE_API_KEY_P8 — the app will be signed but not notarised, and Gatekeeper still warns on a machine that has not seen it before."
          fi
      - name: Build desktop app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
          HAVE_KEY: ${{ steps.signing.outputs.present }}
          # The About panel falls back to a date stamp, which cannot tell two
          # builds of the same day apart — exactly the confusion that cost a
          # debugging round when a test build carried the released version
          # number. The run number can, and it leads back to the run that
          # produced the installer.
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          args=(--bundles "$BUNDLES")
          if [ -n "$TARGET" ]; then
            args+=(--target "$TARGET")
          fi
          if [ "$HAVE_KEY" != "true" ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          npm run tauri build -- "${args[@]}"
      - name: Upload desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: magma-${{ matrix.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sig
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate updater manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse

          root = pathlib.Path("release-artifacts")
          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          version = tag[1:] if tag.startswith("v") else tag

          def first(pattern):
              matches = sorted(root.glob(pattern))
              return matches[0] if matches else None

          def signature(artifact):
              if artifact is None:
                  return None
              sig = pathlib.Path(str(artifact) + ".sig")
              return sig.read_text().strip() if sig.exists() else None

          # The installers are the release. The updater manifest is an extra
          # that only exists when the bundle job had a signing key — without
          # one there is nothing to sign the update with, and publishing a
          # latest.json the app cannot verify would be worse than none at all.
          mac = first("**/*.app.tar.gz")
          win = first("**/*.msi")
          mac_sig = signature(mac)
          win_sig = signature(win)

          def url(path):
              return f"https://github.com/{repo}/releases/download/{tag}/{urllib.parse.quote(path.name)}"

          if mac and win and mac_sig and win_sig:
              latest = {
                  "version": version,
                  "notes": f"Magma {tag}",
                  "platforms": {
                      "darwin-aarch64": {"signature": mac_sig, "url": url(mac)},
                      "darwin-x86_64": {"signature": mac_sig, "url": url(mac)},
                      "windows-x86_64": {"signature": win_sig, "url": url(win)},
                  },
              }
              pathlib.Path("latest.json").write_text(json.dumps(latest, indent=2) + "\n")
              print("wrote latest.json — the in-app updater will see this release")
          else:
              print(
                  "::warning::No updater manifest: TAURI_SIGNING_PRIVATE_KEY was "
                  "not set, so the bundle job built installers only. The release "
                  "is published and installable; the in-app updater will not see "
                  "it. Generate the key (README, Auto-update) to enable updates."
              )

          # The installers themselves must be there either way — a release with
          # nothing to download is not a release.
          missing = [n for n, a in (("dmg", first("**/*.dmg")), ("msi", win)) if a is None]
          if missing:
              raise SystemExit(f"no installer to publish: {', '.join(missing)} missing")
          PY

      # On a version tag the installers go to a Release as well: artifacts
      # expire after 90 days and need a GitHub login to download, which is no
      # way to hand an app to someone.
      - name: Publish installers and updater manifest
        uses: softprops/action-gh-release@v2
        with:
          # A tag push releases under that tag; a dispatch releases under the
          # tag typed into the form, creating it at this commit.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            release-artifacts/**/*.msi
            release-artifacts/**/*.msi.sig
            release-artifacts/**/*.dmg
            release-artifacts/**/*.app.tar.gz
            release-artifacts/**/*.app.tar.gz.sig
            latest.json
          fail_on_unmatched_files: false
          generate_release_notes: true
          body: |
            Desktop builds of Magma for macOS and Windows.

            **These installers are not code-signed**, so the first launch is
            blocked by the OS. That is expected for an app without a
            certificate — the README explains the two clicks it takes:

            - macOS: right-click Magma in *Applications* → **Open** → **Open**
            - Windows: SmartScreen → **More info** → **Run anyway**

            Installation, first steps and how to connect Claude:
            [English](https://github.com/7H3-CH053N/Magma#install) ·
            [Deutsch](https://github.com/7H3-CH053N/Magma/blob/main/README.de.md#installation)
