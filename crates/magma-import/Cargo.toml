[package]
name = "magma-import"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Import external content (WordPress blogs, web pages) into a Magma vault as linked markdown notes."

[dependencies]
magma-core = { path = "../magma-core" }
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = "1"
regex = "1"
