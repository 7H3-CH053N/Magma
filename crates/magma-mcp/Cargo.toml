[package]
name = "magma-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Magma's built-in MCP server — lets Claude and other agents read the vault and co-author correctly linked notes."

[[bin]]
name = "magma-mcp"
path = "src/main.rs"

[dependencies]
magma-core = { path = "../magma-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
